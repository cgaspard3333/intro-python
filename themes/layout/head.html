<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>{{title}}</title>
<link rel="icon" type="image/x-icon" href="{{root}}favicon.ico" />
<script>
// Appliqué avant le premier rendu, pour éviter le flash d'un thème à l'autre.
(function () {
    var root = document.documentElement;
    var theme = 'auto';
    var code = 'dark';
    try {
        theme = localStorage.getItem('cours.theme') || theme;
        code = localStorage.getItem('cours.code') || code;
        localStorage.setItem('cours.groupe', '{{groupId}}');
    } catch (e) {}
    var dark = theme === 'dark'
        || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.themeChoice = theme;
    root.dataset.code = code === 'auto' ? (dark ? 'dark' : 'light') : code;
    root.dataset.codeChoice = code;
})();
</script>
